<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  body{font:13px/1.5 -apple-system,Roboto,Arial,sans-serif;width:260px;margin:12px;color:#202124}
  h1{font-size:14px;margin:0 0 8px}
  label{display:flex;align-items:center;gap:8px;margin:8px 0}
  button{margin-top:8px;padding:5px 10px;border:1px solid #dadce0;border-radius:6px;background:#fff;cursor:pointer}
  .legend span{display:inline-block;padding:0 6px;border-radius:8px;color:#fff;font-weight:600;font-size:11px;margin-right:4px}
  #msg{color:#5f6368;font-size:12px;margin-top:6px}
</style>
</head>
<body>
  <h1>Jev for Gmail</h1>
  <label><input type="checkbox" id="on"> 점수 배지 표시</label>
  <div class="legend">
    <span style="background:#d93025">≥0.7</span><span style="background:#f29900">0.5–0.7</span><span style="background:#80868b">0.3–0.5</span><span style="background:#dadce0;color:#5f6368">&lt;0.3</span>
  </div>
  <div id="msg">받은편지함 기본 탭 · 최근 7일 · 고위험 개인정보 메일은 🔒 · 식별정보 가림 · Gmail 데이터는 변경하지 않음</div>
  <button id="clear">점수 캐시 지우기 (다시 채점)</button>
  <button id="opts">설정 (API 키 등)</button>
  <script src="popup.js"></script>
</body>
</html>
